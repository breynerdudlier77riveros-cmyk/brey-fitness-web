angulo_fase_colombia_2026:
  titulo: >-
    Reference values for bioelectrical impedance–derived phase angle: a
    cross-sectional study of 5,049 healthy individuals from Colombia
  publicacion: "European Journal of Clinical Nutrition"
  anio: 2026
  doi: "10.1038/s41430-026-01744-z"
  url: "https://www.nature.com/articles/s41430-026-01744-z"
  tipo: estudio_transversal
  acceso: restringido
  verificado_el: 2026-08-21
  verificacion: metadatos_confirmados_en_el_editor
  poblacion:
    pais: Colombia
    n: 5049
    mujeres: 3113
    edad: "10 a 94 años"
  publica:
    percentiles: [3, 10, 25, 50, 75, 90, 97]
    metodo: "curvas suavizadas por LMS (Lambda-Mu-Sigma)"
    estratificado_por: [sexo, edad]
    variables: ["Ángulo de fase (°)"]
  nota: >-
    LA MEJOR COINCIDENCIA POBLACIONAL DE LAS CUATRO, y con diferencia: es la
    única sobre población colombiana, que es la del cliente. Cubre además desde
    los 10 años, así que resolvería el hueco pediátrico que el handbook (06)
    deja abierto como pregunta.
    .
    NO SE HA LEÍDO EL TEXTO COMPLETO: el editor exige suscripción. Se confirmó
    su existencia, título, revista, DOI, tamaño y diseño en la página del
    editor. Sus tablas NO pueden transcribirse desde un resumen de búsqueda —
    hacerlo sería exactamente lo que la política de citación prohíbe.
    .
    ATENCIÓN: no consta en la verificación qué dispositivo se usó. Es un dato
    imprescindible antes de admitirla, porque el ángulo de fase depende de la
    frecuencia del aparato (CKB 06).

angulo_fase_biva_europa_2023:
  titulo: >-
    New bioelectrical impedance vector references and phase angle centile
    curves in 4,367 adults: The need for an urgent update after 30 years
  publicacion: "Clinical Nutrition"
  anio: 2023
  volumen: 42
  paginas: "1749-1758"
  doi: "10.1016/j.clnu.2023.07.025"
  tipo: estudio_transversal_multicentrico
  acceso: restringido
  verificado_el: 2026-08-21
  verificacion: metadatos_confirmados_en_el_editor
  poblacion:
    n: 4367
    hombres: 2137
    mujeres: 2230
    edad: "18 a 65 años"
    nota_muestra: "mínimo 35 sujetos por sexo y banda de edad"
  dispositivo:
    tipo: "analizadores mano-pie sensibles a la fase"
    frecuencia: "50 kHz"
  publica:
    percentiles: [3, 5, 10, 25, 50, 75, 90, 95, 97]
    estratificado_por: [sexo, edad]
