  publicacion: "Clinical Nutrition ESPEN"
  anio: 2021
  volumen: 44
  paginas: "379-386"
  doi: "10.1016/j.clnesp.2021.05.009"
  pubmed: "34330493"
  clase: estudio_original
  papel: primaria
  nivel_embudo: E-2
  criterio_fallido: CA-07
  verificado_el: 2026-08-09
  verificacion:
    metadatos: "Título, los cinco autores, revista, año, volumen, paginación, DOI y PMID leídos en el registro de PubMed."
    contenido: "Solo el resumen. **Las tablas no son accesibles.**"
  nota: >-
    Colombia, 3 803 personas de 6 a 64 años. **Análisis secundario de la misma
    Encuesta Nacional de la Situación Nutricional de 2015** que
    `martinez_torres_hgs_colombia_2022`. Percentiles P3 a P97 por el método LMS.
  motivo_no_admision: >-
    **Deuda de acceso.** Sin las tablas no puede comprobarse CA-07.
  acceso_verificado_el: 2026-08-10
  acceso_comprobado_en:
    - "Unpaywall · is_oa false · has_repository_copy false · best_oa_location null"
    - "OpenAlex · is_oa false · oa_status closed · solo editorial y PubMed"
    - "Crossref · licencia Elsevier TDM · «All rights reserved»"
    - "Semantic Scholar · isOpenAccess false · openAccessPdf vacío"
    - "Europe PMC · isOpenAccess N · inPMC N · hasPDF N · sin PMCID"
    - "OpenAIRE · sin copia en repositorio institucional"
    - "ScienceDirect y clinicalnutritionespen.com · HTTP 403"
    - "Observatorio de Investigación de la UPNA · solo metadatos"
  nota_acceso: >-
    Seis índices independientes de acceso abierto coinciden: **no existe ninguna
    copia legible**. La determinación está comprobada, no supuesta.
  coordenadas_no_determinables:
    - "Instrumento: el resumen dice «a hand dynamometer with an adjustable grip», descripción compatible con varios modelos y que no identifica ninguno"
    - "Posición corporal: no accesible"
    - "Definición operacional: no accesible"
  importancia: >-
    Es la **candidata a primer conflicto normativo real** de la NKB: comparte
    encuesta, país, variable y franja etaria con una norma ya publicada. Ver
    `34`.
  advertencia: >-
    Su resumen declara un punto de corte definido como 2 desviaciones típicas
    por debajo de la media máxima del ciclo vital, específica por sexo. Ese
    origen es **distributivo, no de desenlace**: si la fuente se admitiera, sus
    percentiles entrarían como TN-1 y ese umbral **no** entraría como TN-5. Es
    la misma decisión que RN-02 (`28`).

