# ── Referencias CANDIDATAS · pendientes de admisión ─────────────────────────
#
# QUÉ ES ESTE FICHERO Y POR QUÉ NO ES `referencias.yaml`.
#
#   `referencias.yaml` es el registro de lo ADMITIDO: lo que las fichas pueden
#   citar y lo que el sistema puede usar para afirmar algo. Esto es la bandeja
#   de entrada.
#
#   Todas las entradas de aquí se localizaron y se comprobaron una a una: no
#   hay ninguna registrada por plausibilidad ni por aparecer en un resumen de
#   búsqueda. Pero verificada no es lo mismo que admisible, y quien admite una
#   norma es el profesional, no quien la encuentra.
#
#   El campo `verificacion` dice exactamente HASTA DÓNDE se comprobó cada una.
#   Distinguir «leí el artículo entero» de «confirmé que existe y sus datos de
#   portada» es la diferencia entre poder transcribir su tabla y no poder.
#
# MOTIVO DE LA BÚSQUEDA (2026-08-21)
#
#   De las 25 variables del BCS, solo el IMC se clasifica. El bloqueo de las
#   demás no era conceptual: faltaban valores de referencia publicados. Estas
#   cuatro entradas los tienen, por sexo y por banda de edad, en muestras
#   grandes y recientes.
#
# LO QUE NINGUNA DE ELLAS RESUELVE
#
#   · Grasa visceral. Ninguna publica valores de referencia para el índice
#     visceral. Sigue exactamente donde estaba: escala propietaria del
#     fabricante, sin equivalencia entre marcas, y la CKB (04, 12 §5) declara
#     no admisible clasificarla con un rango de fuente comercial.
#   · Cociente ECW/TBW en población sana. No se localizó.
#
# EL LÍMITE QUE AFECTA A LAS CUATRO
#
#   Son valores de referencia obtenidos POR BIOIMPEDANCIA, con un aparato
#   concreto. La CKB (06) prohíbe comparar entre fabricantes distintos. Tres de
#   las cuatro usan InBody —el mismo fabricante del dispositivo del
#   profesional— pero modelos distintos (S10, 230), y que dos modelos de la
#   misma marca sean intercambiables NO está demostrado en ninguna de ellas.
#   Es la pregunta que hay que responder antes de admitirlas, no después.

# ════════════════════════════════════════════════════════════════════════════
# % GRASA CORPORAL, MASA GRASA, MASA LIBRE DE GRASA
# ════════════════════════════════════════════════════════════════════════════

amaral_percentiles_bia_2022:
  titulo: >-
    Reference percentiles for bioimpedance body composition parameters of
    healthy individuals: A cross-sectional study
  autores: >-
    Amaral MA, Mundstock E, Scarpatto CH, Cañon-Montañez W, Mattiello R
  publicacion: "Clinics (São Paulo)"
  anio: 2022
  volumen: 77
  doi: "10.1016/j.clinsp.2022.100078"
  pubmed: "36087566"
  tipo: estudio_transversal
  acceso: abierto
  verificado_el: 2026-08-21
  verificacion: texto_completo_leido
  poblacion:
    pais: Brasil
    region: "sur de Brasil"
    n: 1240
    mujeres: 651
    hombres: 589
    edad: "5 años en adelante"
    ciclos_vitales: "niños 5-9 · adolescentes 10-19 · adultos 20-59 · mayores ≥60"
    reclutamiento: "empresas y eventos; captación boca a boca"
  dispositivo:
    modelo: "InBody S10"
    frecuencia: "50 kHz"
  publica:
    percentiles: [5, 10, 25, 50, 75, 90, 95]
    estratificado_por: [sexo, banda_de_edad]
    variables:
      - "Masa grasa total (kg)"
      - "Porcentaje de grasa corporal (%)"
      - "Masa libre de grasa (kg)"
      - "Porcentaje de masa magra (%)"
      - "Índice de masa grasa (kg/m²)"
      - "Índice de masa libre de grasa (kg/m²)"
  limitaciones_declaradas:
    - "Los autores no presentan resultados por raza."
    - "No es una muestra probabilística de la población brasileña."
  verificacion_completa: 2026-08-21
  filas_cargadas: ["Percentage of body fat (%)", "Total body fat (kg)", "Fat free mass (kg)"]
  celdas_inutilizables:
    - celda: "Varones ≥60 años (n=16), las tres variables"
      motivo: >-
        n = 16. Los propios métodos del artículo declaran haber considerado un
        mínimo de 50 participantes por sexo y ciclo vital, así que esa celda
        incumple el criterio de sus autores. En la tabla de porcentaje graso
        además imprime el percentil 10 (15,0 %) POR DEBAJO del percentil 5
        (18,1 %), que es imposible en una distribución.
  nota: >-
    ADMITIDA tras leer el PDF completo. Cubre `grasa_pct` —la variable por la
    que un cliente abre el informe—, `masa_grasa_kg` y `masa_libre_grasa_kg`.
    Mismo fabricante que el aparato del profesional, modelo distinto.

# ════════════════════════════════════════════════════════════════════════════
# MASA MUSCULAR Y SMI
# ════════════════════════════════════════════════════════════════════════════

coelho_junior_musculo_2024:
  titulo: >-
    Age- and sex-specific normative values for muscle mass parameters in
    18,625 Brazilian adults
  autores: >-
    Coelho-Júnior HJ, Marques FL, Sousa CV, Marzetti E, da Silva Aguiar S
  publicacion: "Frontiers in Public Health"
  anio: 2024
  doi: "10.3389/fpubh.2023.1287994"
  pubmed: "38235157"
  tipo: estudio_transversal
  acceso: abierto
  verificado_el: 2026-08-21
  verificacion: texto_completo_leido
  poblacion:
    pais: Brasil
    region: "Brasilia"
    n: 18625
    mujeres: 10572
    hombres: 8053
    edad: "18 años en adelante"
    bandas: "18-29 · 30-39 · 40-49 · 50-59 · 60-69 · 70-79 · 80+"
    reclutamiento: "clínica privada de nutrición, enero 2018 – julio 2022"
  dispositivo:
    modelo: "InBody 230"
    metodo: "tetrapolar mano-pie, 8 electrodos táctiles"
    condiciones: "ayuno de 8 h y sin ejercicio en las 96 h previas"
  publica:
    percentiles: [5, 25, 50, 75, 95]
    estratificado_por: [sexo, banda_de_edad]
    variables:
      - "Masa muscular absoluta (kg)"
      - "Masa muscular esquelética apendicular (kg)"
      - "Índice de masa muscular esquelética I (masa absoluta / talla²)"
      - "Índice de masa muscular esquelética II (masa apendicular / talla²)"
  limitaciones_declaradas:
    - "«Nuestros resultados deben extrapolarse con cuidado a personas en otras condiciones.»"
    - "Sin datos de actividad física ni de prevalencia de enfermedad."
    - "Pacientes de una clínica privada de nutrición: posiblemente no representativos de la población brasileña general."
  verificacion_completa: 2026-08-21
  filas_utilizables: ["Masa muscular (kg)", "SMI II (kg/m²)"]
  filas_con_error_de_imprenta: ["Masa muscular apendicular (ASM)", "SMI I (kg/m²)"]
  nota: >-
    ADMITIDA PARCIALMENTE tras leer el PDF completo. Solo se carga la fila de
    masa muscular absoluta.
    .
    DOS DE LAS CUATRO TABLAS NORMATIVAS TIENEN LOS CENTILES TRANSPUESTOS. En
    varones de 18 a 29 años, la fila «Appendicular muscle mass (kg)» imprime
    centiles de 9,0 a 13,2 junto a una media de 26,1 kg, y la fila «SMI I»
    imprime centiles de 20,2 a 32,5 junto a una media de 11,0 kg/m². Cada
    bloque de centiles corresponde a la OTRA fila. La columna Mean (SD) sí
    coincide con la Tabla 1 en ambos casos, y el mismo intercambio se repite
    en la Tabla 3 (mujeres), así que lo permutado son los bloques de centiles,
    no las medias.
    .
    No se deshace el cambio: reescribir una fuente publicada a partir de una
    deducción propia, por sólida que parezca, es exactamente lo que la política
    de citación impide. Se declara y se dejan fuera.
    .
    SMI II es coherente y no se carga por otro motivo: el catálogo del BCS
    define `smi` sin precisar si es masa muscular absoluta o apendicular sobre
    la talla al cuadrado, y compararlas sería comparar dos magnitudes.

