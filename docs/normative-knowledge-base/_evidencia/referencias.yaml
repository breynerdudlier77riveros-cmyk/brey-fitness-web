ramirez_velez_hgs_colombia_6_64_2021:
  titulo: >-
    Handgrip strength: Normative reference values in males and females aged
    6–64 Years old in a Colombian population
  autores: >-
    Ramírez-Vélez R, Rincón-Pabón D, Correa-Bautista JE, García-Hermoso A,
