tomkinson_normas_internacionales_2024:
  titulo: >-
    International norms for adult handgrip strength: A systematic review of
    data on 2.4 million adults aged 20 to 100+ years from 69 countries and
    regions
  autores: >-
    Tomkinson GR, Lang JJ, Rubín L, McGrath R, Gower B, Boyle T, Klug MG,
    Mayhew AJ, Blake HT, Ortega FB, Cadenas-Sanchez C, Magnussen CG,
    Fraser BJ, Kidokoro T, Liu Y, Christensen K, Leong DP; iGRIPS Group
  publicacion: "Journal of Sport and Health Science"
  anio: 2024
  volumen: 14
  articulo: "101014"
  doi: "10.1016/j.jshs.2024.101014"
  pubmed: "39647778"
  clase: revision_sistematica
  papel: primaria_para_su_agregado
  nivel_embudo: E-4
  criterio_fallido: CA-05
  verificado_el: 2026-08-09
  nota: >-
    Agrega 100 estudios observacionales y publica percentiles del 5 al 95 por
    sexo y edad. Para armonizar los estudios aplica factores de ajuste de entre
    el 1% y el 17% sobre mediciones obtenidas con dinamómetros hidráulicos,
    electrónicos y mecánicos y con protocolos distintos.
  motivo_no_admision: >-
    El método resultante no es un procedimiento de medición reproducible sino
    una armonización posterior: no puede determinarse qué medición concreta de
    un sujeto correspondería a esta norma sin conocer y aplicar el factor de
    ajuste de su propio protocolo. Ver módulo 29.

