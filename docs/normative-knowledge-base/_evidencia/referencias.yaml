# ── Registro de referencias verificadas · NKB ──────────────────────────────
#
# SSoT de la base normativa. Ninguna ficha escribe una cita a mano: todas
# apuntan aquí por clave.
#
# POLÍTICA (NKB-2, módulo 04 e I-10): cada entrada se localizó y comprobó antes
# de registrarse. Los campos que no se pudieron confirmar se OMITEN, nunca se
# completan por plausibilidad. Nunca se inventa un identificador persistente.
#
# `verificado_el` es la fecha de comprobación, no la de publicación.
